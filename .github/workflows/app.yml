name: App CI

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/app.yml
      - app/**
      - packages/api_client/**
  pull_request:
    branches: [ main ]
  workflow_call:

env:
  flutter-version: 3.24.3

jobs:

  verified:
    runs-on: ubuntu-22.04
    needs:
      - analyze
      - build
      - format
      - test
    steps:
      - run: echo "I've been looking forward to this passing build for a long time."

  analyze:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          channel: 'stable'
      - name: analyze
        run: flutter analyze
        working-directory: app

  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          channel: 'stable'
      - name: build web
        run: flutter build web
        working-directory: app

  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          channel: 'stable'
      - name: format
        run: dart format lib test --set-exit-if-changed
        working-directory: app

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          channel: 'stable'
      - name: test
        run: flutter test
        working-directory: app
