name: App CI

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/app.yml
      - app/**
      - packages/api_client/**
      - pnpm-lock.yaml
  pull_request:
    branches: [ main ]

env:
  flutter_version: 3.27.1

jobs:

  verified:
    runs-on: ubuntu-22.04
    needs:
      - flutter_ci
      - build_android
    steps:
      - run: echo "I've been looking forward to this passing build for a long time."

  flutter_ci:
    uses: ./.github/workflows/flutter_verify.yml
    with:
      flutter_package: app

  build_android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: mls
      - uses: actions/checkout@v4
        with:
          repository: eighty4/libtab
          path: libtab
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: 'stable'
      - name: build android
        run: flutter build appbundle
        working-directory: mls/app
