name: Flutter integration test
run-name: ${{ inputs.flutter_package }} integration test

on:
  workflow_call:
    inputs:
      flutter_package:
        description: Path from repository root to Flutter package
        type: string
        required: true

env:
  flutter_version: 3.38.5

# test job used to test studio and mls_api packages, both packages' tests depend on libtab, web and postgres
jobs:

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: mls
      - run: docker compose up -d --wait
        working-directory: mls
      - name: sql
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=eighty4 psql -h localhost -U eighty4 -f v001-init-schema.sql eighty4
        working-directory: mls/sql
      - uses: actions/checkout@v4
        with:
          repository: eighty4/libtab
          path: libtab
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: 'stable'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: activate pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate
      - run: pnpm i
        working-directory: mls
      - name: web
        run: |
          pnpm dev &
          sleep 5
        working-directory: mls/web
      - name: playwright install
        run: pnpm exec playwright install --with-deps
        working-directory: mls/packages/create_auth_token
      - name: test
        run: flutter test
        working-directory: "mls/${{ inputs.flutter_package }}"
