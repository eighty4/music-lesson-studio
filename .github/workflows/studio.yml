name: Studio CI

on:
  push:
    branches: [ main ]
    paths:
      - studio/**
  pull_request:
    branches: [ main ]
  workflow_call:

env:
  flutter-version: 3.19.6

jobs:
  verified:
    runs-on: ubuntu-22.04
    needs:
      - analyze
      - format
      - build
      - test
    steps:
      - run: echo "I just want to break the build"

  analyze:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          channel: 'stable'
      - name: analyze
        run: flutter analyze
        working-directory: studio

  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          channel: 'stable'
      - name: format
        run: dart format lib test --set-exit-if-changed
        working-directory: studio

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          channel: 'stable'
      - name: test
        run: flutter test
        working-directory: studio

  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          channel: 'stable'
      - name: build web
        run: flutter build web
        working-directory: studio
